# Run A (cloud, Vast.ai RTX 4090, weekend of Oct 2): configs/9x9.yaml plus ONE change, the value
# target blended with the full search's root value: (1 - w) * z + w * q, w = 0.5. Starts from
# runs/9x9_a at cycle 471. selfplay_workers is set by tools/cloud/train.sh from the benchmark.
# Compare with run B (laptop, lr 0.0006, no blend) from the same start.
net: {board_size: 9, blocks: 10, channels: 128, head_channels: 32, value_hidden: 128}
selfplay:
  num_parallel: 256
  full_visits: 1000
  fast_visits: 60
  full_prob: 0.25
  temp_start: 1.0
  temp_end: 0.25
  temp_halflife: 8
  resign_enabled: false
  mcts: {c_puct: 1.25, fpu_reduction: 0.2, root_fpu_reduction: 0.0, dirichlet_alpha: 0.15, dirichlet_eps: 0.25}
train:
  batch_size: 256
  optimizer: sgd
  lr: 0.002
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 300
  ownership_weight: 1.0
  score_weight: 0.5
  value_q_weight: 0.5      # run A's one change
loop:
  cycle_samples: 5000
  train_ratio: 4.0
  min_buffer: 20000
  min_window: 25000
  max_window: 400000
  buffer_capacity: 500000
  snapshot_every: 10
  buffer_save_every: 5
  selfplay_workers: 1      # set by tools/cloud/train.sh
eval:
  every_cycles: 10
  anchors: [runs/eval_night6/candidate_c439.pt]
  num_pairs: 32
  visits: 100
