# KataGo as a fixed-strength yardstick for go-zero (an opponent to measure against, never training data).
# Rules match the gtp_match.py referee and CGOS: area scoring, positional superko, no suicide, dead stones
# must be captured. Strength is set with maxVisits on the command line:
#   katago.exe gtp -config configs/katago_yardstick.cfg -model tools/katago/<net>.bin.gz -override-config maxVisits=16

logDir = runs/katago_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
friendlyPassOk = false
whiteHandicapBonus = 0
conservativePass = true

allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3
ponderingEnabled = false

maxVisits = 16
numSearchThreads = 1
searchFactorAfterOnePass = 1.0
searchFactorAfterTwoPass = 1.0

nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
numNNServerThreadsPerModel = 1
logSearchInfoForChosenMove = false
maxTimePondering = 0
lagBuffer = 1.0
searchFactorWhenWinning = 1.0
searchFactorWhenWinningThreshold = 0.99
